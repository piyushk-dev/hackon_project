<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghar Sense — Sharma Niwas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/sense.css" />
</head>
<body class="sense-page">
  <div id="sense-app">

    <!-- ─── Slim header ─────────────────────────────────────────── -->
    <header class="sense-header">
      <div class="brand">
        <span class="brand-mark">🏡</span>
        <div>
          <div class="brand-name">Ghar Sense</div>
          <div class="brand-sub">Sharma Niwas</div>
        </div>
      </div>

      <div class="clock-block">
        <span id="clock-sky" class="clock-sky">🌅</span>
        <div id="sim-clock" class="sim-clock">5:45 AM</div>
        <button id="play-btn" class="play-btn">▶ Play the Day</button>
        <div class="speed-group">
          <button class="speed-btn" data-speed="2">1×</button>
          <button class="speed-btn active" data-speed="4">2×</button>
          <button class="speed-btn" data-speed="12">6×</button>
        </div>
      </div>

      <div class="stats-block">
        <div class="stat">
          <div id="stat-savings" class="stat-value">₹12</div>
          <div class="stat-label">saved</div>
        </div>
        <div class="stat">
          <div id="stat-actions" class="stat-value">3</div>
          <div class="stat-label">handled</div>
        </div>
        <a class="back-link" href="/classic.html" title="Open the classic 2D demo">2D</a>
      </div>
    </header>

    <!-- ─── The stage: 3D house + floating overlays ─────────────── -->
    <main class="stage">
      <div id="house-canvas"></div>

      <!-- Alexa announcement bubble -->
      <div id="alexa-toast" class="alexa-toast">
        <div class="alexa-ring"><span></span></div>
        <div class="alexa-toast-body">
          <div id="alexa-toast-text" class="alexa-toast-text"></div>
          <div id="alexa-toast-target" class="alexa-toast-target"></div>
        </div>
      </div>

      <!-- Left: Alexa's diary -->
      <aside class="dock dock-left" id="diary-dock">
        <div class="dock-head">
          <span class="dock-title">💭 Alexa's Diary</span>
          <button class="dock-toggle" title="Collapse">–</button>
        </div>
        <div class="dock-body" id="feed-panel"></div>
      </aside>

      <!-- Right: family (asks, trust, wellness) -->
      <aside class="dock dock-right" id="family-dock">
        <div class="dock-head">
          <span class="dock-title">🤝 Family & Trust</span>
          <button class="dock-toggle" title="Collapse">–</button>
        </div>
        <div class="dock-body">
          <div id="voice-panel"></div>
          <div id="wellness-panel" class="wellness collapsed"></div>
        </div>
      </aside>

      <!-- Bottom: waveform + vitals pills -->
      <div id="status-bar">
        <div id="wave-strip"></div>
        <div id="status-pills"></div>
      </div>

      <span class="house-hint">🖱️ drag to look around</span>

      <!-- Scenario launcher -->
      <div class="scenario-fab-wrap">
        <div id="scenario-menu" class="scenario-menu">
          <button class="scenario-btn" data-scenario="cooker">🍲 Cooker Whistles</button>
          <button class="scenario-btn" data-scenario="motor">🚱 Motor Dry-Run</button>
          <button class="scenario-btn" data-scenario="powercut">⚡ Power Cut</button>
          <button class="scenario-btn" data-scenario="pooja">🛕 Pooja Bell</button>
          <button class="scenario-btn" data-scenario="guest">🔔 Guests Arrive</button>
          <button class="scenario-btn" data-scenario="aqi">💨 AQI Spike</button>
          <button class="scenario-btn" data-scenario="iron">🔥 Iron Left On</button>
          <button class="scenario-btn" data-scenario="cough">🤒 Night Cough</button>
          <button class="scenario-btn" data-scenario="voice">🗣️ Voice Moments</button>
        </div>
        <button id="scenario-fab" class="scenario-fab">🎬 Scenarios</button>
      </div>
    </main>
  </div>

  <script type="module" src="/src/sense/main.js"></script>
</body>
</html>
