<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alexa Thinks Ahead - Interactive Smart Home Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3.5 10.5 12 3.5l8.5 7' fill='none' stroke='%232E7CF6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M5.5 9.5V20h13V9.5' fill='none' stroke='%232E7CF6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/glassmorphism.css" />
  <link rel="stylesheet" href="/src/styles/panels.css" />
</head>
<body>
  <div id="app">
    <!-- 3D Scene Container -->
    <div id="3d-container"></div>

    <!-- Flicker Overlay for Power Cut Effect -->
    <div id="flicker-overlay"></div>

    <!-- Learning Phase Panel -->
    <div id="learning-phase" class="phase-panel">
      <div class="panel-content glass-panel">
        <div class="brand-header">
          <span class="brand-badge">●</span>
          <div>
            <div class="brand-title">Alexa Thinks Ahead</div>
            <div class="brand-subtitle">Learning Phase</div>
          </div>
        </div>
        <div id="event-form"></div>
        <div id="event-list"></div>
        <button id="deploy-btn" class="btn-deploy">Deploy →</button>
      </div>
    </div>

    <!-- Deployment Phase Panel -->
    <div id="deployment-phase" class="phase-panel hidden">
      <!-- Timeline Scrubber (bottom) -->
      <div id="timeline-panel" class="glass-panel"></div>

      <!-- Event Log Sidebar (right) -->
      <div id="event-log-panel" class="glass-panel"></div>

      <!-- Trust Gauges Overlay -->
      <div id="trust-gauges" class="glass-panel"></div>
    </div>

    <!-- Reasoning Panel (Power Cut Overlay) -->
    <div id="reasoning-panel" class="glass-panel hidden"></div>

    <!-- Data Mode Toggle -->
    <div id="data-toggle" class="glass-panel"></div>

    <!-- Ghar Sense page link -->
    <a href="/index.html" class="glass-panel" style="position: fixed; bottom: 1rem; right: 14.5rem; padding: 0.5rem 1rem; font-size: 0.75rem; z-index: 20; text-decoration: none; color: #2E7CF6; font-weight: 600;">Ghar Sense 3D →</a>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
